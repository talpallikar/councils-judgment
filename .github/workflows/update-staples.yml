name: Update staple lists

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/build_staples.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet docs/staples.json; then
            git config user.name "staples-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/staples.json
            git commit -m "chore: refresh staple lists"
            git push
          else
            echo "No changes."
          fi
